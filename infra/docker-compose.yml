services:
  postgres:
    image: postgres:16
    container_name: experimentation_postgres
    environment:
      POSTGRES_DB: experimentation
      POSTGRES_USER: experimentation_user
      POSTGRES_PASSWORD: experimentation_password
    ports:
      - "5432:5432"
    volumes:
      - experimentation_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experimentation_user -d experimentation"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  experimentation_postgres_data:
